name: Scheduled Backup

on:
  schedule:
    # Midnight fleet backup window (all active tenants currently use "0 0 * * *")
    - cron: '0 0 * * *'
    # 1-hour retry band for failed or pending backups
    - cron: '15,30,45 0 * * *'
    - cron: '0,15,30,45 1 * * *'
    # When onboarding a tenant with a new schedule, add a cron line here that
    # covers the schedule minute/hour plus a 1-hour retry band (max 5 cron entries).
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Specific tenant to backup (leave blank for all active)'
        required: false
        type: string

concurrency:
  group: scheduled-backup-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Parse tenants.yaml and generate matrix
  # -------------------------------------------------------------------------
  prepare-matrix:
    name: Prepare Backup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      count: ${{ steps.parse.outputs.count }}
      all_active: ${{ steps.parse.outputs.all_active }}
      schedule_match: ${{ steps.parse.outputs.schedule_match }}
    steps:
      - name: Checkout main (for tenants.yaml and parse script)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse tenants.yaml
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tenant }}" ]; then
            # Manually trigger a specific tenant (bypasses schedule/pending logic)
            MATRIX=$(node scripts/parse-tenants.mjs --all --tenant "${{ inputs.tenant }}")
            COUNT=1
            ALL_ACTIVE='{"include":[]}'
            SCHEDULE_MATCH='{"include":[]}'
          else
            ALL_ACTIVE=$(node scripts/parse-tenants.mjs --active-only)
            SCHEDULE_MATCH=$(node scripts/parse-tenants.mjs --active-only --check-schedule)
            # Cron entries define when to attempt backups; --check-pending alone decides who
            # still needs a run. Do not also filter by --check-schedule here — GitHub Actions
            # often delays scheduled runs past the retry window and would skip the whole matrix.
            MATRIX=$(node scripts/parse-tenants.mjs --active-only --check-pending)
            COUNT=$(echo "$MATRIX" | jq '.include | length')
            if [ "$COUNT" = "0" ]; then
              echo "No pending backups — skipping matrix"
            fi
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "all_active=$ALL_ACTIVE" >> $GITHUB_OUTPUT
          echo "schedule_match=$SCHEDULE_MATCH" >> $GITHUB_OUTPUT
          echo "Scheduled backups: $COUNT tenant(s)"
          echo "$MATRIX" | jq .

  # -------------------------------------------------------------------------
  # Job 2: Run backup for each tenant in parallel
  # -------------------------------------------------------------------------
  backup:
    name: Backup ${{ matrix.tenant }}
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.jobTimeoutMinutes || 15 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    environment: ${{ matrix.tenant }}

    steps:
      - name: Checkout main (scripts + package.json)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch tenant backup data
        run: |
          git fetch origin ${{ matrix.tenant }} --depth=1
          rm -rf backups/ 2>/dev/null || true
          git checkout origin/${{ matrix.tenant }} -- backups/ 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backup
        env:
          TENANT_URL: ${{ secrets.TENANT_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_NAME: ${{ matrix.tenant }}
          EXPORT_POLL_MINUTES: ${{ matrix.exportPollMinutes }}
          MAX_EXPORT_ATTEMPTS: "3"
        run: node scripts/cli.mjs backup

      - name: Compute backup statistics
        id: stats
        if: always()
        run: |
          STATS=$(node scripts/generate-backup-stats.mjs)
          echo "stats=$STATS" >> $GITHUB_OUTPUT
          echo "$STATS" | jq .

      - name: Commit and push changes
        run: |
          run_create_backup_tag() {
            set -euo pipefail
            local tag_name="$1"
            local script_dir
            script_dir=$(mktemp -d)
            mkdir -p "$script_dir/scripts"
            for script in create-backup-tag.sh push-backup-tag.sh push-with-retry.sh; do
              git show "main:scripts/$script" > "$script_dir/scripts/$script"
              chmod +x "$script_dir/scripts/$script"
            done
            bash "$script_dir/scripts/create-backup-tag.sh" "$tag_name"
            rm -rf "$script_dir"
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Switch to the tenant branch so the commit lands on the correct branch.
          # (The job checked out main for scripts; the backup data belongs on the tenant branch.)
          git checkout -B ${{ matrix.tenant }} origin/${{ matrix.tenant }}
          git add backups/
          if git diff --cached --quiet; then
            echo "No changes detected — skipping commit but tagging current HEAD"
            TIMESTAMP=$(date -u +%Y-%m-%d_%H-%M-%S)
            TAG_NAME="${{ matrix.tenant }}/$TIMESTAMP"
            run_create_backup_tag "$TAG_NAME"
            echo "STATUS=unchanged" >> $GITHUB_ENV
            echo "TAG=$TAG_NAME" >> $GITHUB_ENV
          else
            TIMESTAMP=$(date -u +%Y-%m-%d_%H-%M-%S)
            TAG_NAME="${{ matrix.tenant }}/$TIMESTAMP"
            git commit -m "backup: $(date -u +%Y-%m-%d) ISC configuration snapshot"

            # The remote branch may have moved while the backup was running.
            # Try to push; if it fails, fetch the latest tip and re-apply our
            # backup changes on top of it.
            if ! git push origin ${{ matrix.tenant }}; then
              echo "Push rejected; fetching latest remote tip and re-applying backup changes..."
              git fetch origin ${{ matrix.tenant }} --depth=1
              git reset --soft origin/${{ matrix.tenant }}
              git add backups/
              git commit -m "backup: $(date -u +%Y-%m-%d) ISC configuration snapshot"
              git push origin ${{ matrix.tenant }}
            fi
            echo "STATUS=backed-up" >> $GITHUB_ENV
            echo "TAG=$TAG_NAME" >> $GITHUB_ENV
            run_create_backup_tag "$TAG_NAME"
          fi

      - name: Publish backup release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_STATS: ${{ steps.stats.outputs.stats }}
        run: |
          SCRIPT=$(mktemp)
          git show main:scripts/create-backup-release.sh > "$SCRIPT"
          chmod +x "$SCRIPT"
          bash "$SCRIPT" "$TAG" "${{ matrix.tenant }}" "$BACKUP_STATS"
          rm -f "$SCRIPT"

      - name: Report status
        id: report
        if: always()
        run: |
          STATS='${{ steps.stats.outputs.stats }}'
          if [ -z "$STATS" ] || [ "$STATS" = "" ]; then
            STATS='{"size":0,"files":0,"added":0,"deleted":0,"modified":0}'
          fi

          if [ "$STATUS" = "backed-up" ]; then
            MESSAGE="✅ ${{ matrix.tenant }}: Backed up successfully ($TAG)"
          elif [ "$STATUS" = "unchanged" ]; then
            MESSAGE="ℹ️ ${{ matrix.tenant }}: No changes detected"
          else
            STATUS="failed"
            MESSAGE="❌ ${{ matrix.tenant }}: Backup failed"
          fi

          echo "$MESSAGE"
          SIZE=$(echo "$STATS" | jq -r '.size')
          FILES=$(echo "$STATS" | jq -r '.files')
          ADDED=$(echo "$STATS" | jq -r '.added')
          DELETED=$(echo "$STATS" | jq -r '.deleted')
          MODIFIED=$(echo "$STATS" | jq -r '.modified')
          echo "| ${{ matrix.tenant }} | $STATUS | $TAG | $SIZE | $FILES | +$ADDED | -$DELETED | ~$MODIFIED |"

          RESULT=$(jq -nc \
            --arg tenant "${{ matrix.tenant }}" \
            --arg status "$STATUS" \
            --arg tag "$TAG" \
            --arg schedule "${{ matrix.schedule }}" \
            --argjson stats "$STATS" \
            '{tenant:$tenant,status:$status,tag:$tag,schedule:$schedule,size:$stats.size,files:$stats.files,added:$stats.added,deleted:$stats.deleted,modified:$stats.modified}')
          mkdir -p backup-results
          echo "$RESULT" > "backup-results/${{ matrix.tenant }}.json"

      - name: Upload backup result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-results-${{ matrix.tenant }}
          path: backup-results/
          retention-days: 1

  cleanup-deployment:
    name: Cleanup deployment ${{ matrix.tenant }}
    needs: [prepare-matrix, backup]
    if: always() && needs.prepare-matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Remove ephemeral deployment trace
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SCRIPT="${RUNNER_TEMP}/cleanup-deployment.sh"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/cleanup-deployment.sh?ref=main" --jq .content | base64 -d > "$SCRIPT"
          chmod +x "$SCRIPT"
          bash "$SCRIPT" "${{ matrix.tenant }}"

  # -------------------------------------------------------------------------
  # Job 3: Generate summary report and dashboard
  # -------------------------------------------------------------------------
  summary:
    name: Backup Summary
    needs: [prepare-matrix, backup, cleanup-deployment]
    if: ${{ always() && needs.prepare-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch backup tags
        run: git fetch origin --tags

      - name: Download backup results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: backup-results-*
          merge-multiple: true
          path: backup-results

      - name: Generate summary
        id: summary
        run: |
          DATE=$(date -u +%Y-%m-%d)
          REPORT_FILE="reports/backup-summary-${DATE}.md"
          mkdir -p reports

          if compgen -G "backup-results/*.json" > /dev/null; then
            RESULTS=$(jq -s '.' backup-results/*.json)
          else
            RESULTS='[]'
          fi
          ALL_ACTIVE='${{ needs.prepare-matrix.outputs.all_active }}'
          SCHEDULE_MATCH='${{ needs.prepare-matrix.outputs.schedule_match }}'
          COUNT='${{ needs.prepare-matrix.outputs.count }}'
          NOW_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          RESULTS_INPUT="$RESULTS" \
          REPORT_ALL_ACTIVE="$ALL_ACTIVE" \
          REPORT_SCHEDULE_MATCH="$SCHEDULE_MATCH" \
          REPORT_COUNT="$COUNT" \
          REPORT_REGISTRY="tenants.yaml" \
          REPORT_NOW="$NOW_ISO" \
            node --input-type=module -e '
              const { generateReport } = await import("./scripts/generate-report.mjs");
              const { loadRegistry } = await import("./scripts/tenant-registry.mjs");
              const registry = loadRegistry(process.env.REPORT_REGISTRY);
              const md = generateReport(process.env.RESULTS_INPUT || "", registry, new Date(process.env.REPORT_NOW), {
                allActiveJson: process.env.REPORT_ALL_ACTIVE,
                scheduleMatchJson: process.env.REPORT_SCHEDULE_MATCH,
                scheduledCount: parseInt(process.env.REPORT_COUNT || "0", 10),
              });
              process.stdout.write(md);
            ' > "$REPORT_FILE"

          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
          {
            echo "results_json<<EOF"
            echo "$RESULTS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Generate README and tenant shortcuts
        env:
          BACKUP_RESULTS: ${{ steps.summary.outputs.results_json }}
        run: node scripts/generate-readme.mjs README.md

      # Kept separate from the shortcut commit below: GITHUB_TOKEN has no
      # workflows permission, so bundling generated workflow files here would
      # let a rejected push block the whole fleet dashboard.
      - name: Commit README and report to main
        env:
          REPORT_FILE: ${{ steps.summary.outputs.report_file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md "$REPORT_FILE"
          if git diff --cached --quiet; then
            echo "No README or report changes to commit"
          else
            git commit -m "ops-dashboard: $(date -u +%Y-%m-%d) fleet status and backup summary"
            git push origin main
          fi

      - name: Commit tenant shortcut workflows to main
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          git add .github/workflows/isc-backup-*.yml .github/workflows/isc-toggle-*.yml
          if git diff --cached --quiet; then
            echo "No shortcut workflow changes to commit"
            exit 0
          fi

          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::Tenant shortcut workflows changed but ADMIN_TOKEN is not configured; skipping. Run scripts/generate-readme.mjs locally and commit them."
            git reset
            exit 0
          fi

          git commit -m "ops-dashboard: sync tenant shortcut workflows"
          git config --unset-all "http.https://github.com/.extraheader" || true
          if ! git push "https://x-access-token:${ADMIN_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
            echo "::warning::Could not push tenant shortcut workflows. ADMIN_TOKEN needs Workflows: Read and write to create or update files under .github/workflows."
          fi

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-dashboard-${{ github.run_id }}
          path: README.md

      - name: Display dashboard summary
        run: |
          sed -n '/## Operations Dashboard/,$p' README.md >> $GITHUB_STEP_SUMMARY





